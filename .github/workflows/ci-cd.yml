name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API dependencies
        run: |
          pip install -r transaction-api/requirements.txt

      - name: Build API Docker image
        run: docker build -t fraud-api ./transaction-api

      - name: Build Fraud Engine Docker image
        run: docker build -t fraud-engine ./fraud-engine

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0114702d5ebfe723a \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/cloud-native-fraud-platform && git pull origin main && docker compose up -d --build"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0114702d5ebfe723a

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0114702d5ebfe723a \
            --query "StandardOutputContent" \
            --output text